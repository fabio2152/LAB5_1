spring.application.name=champions

# Puerto HTTP de la aplicación
server.port=${APP_PORT:8080}

# --- Base de datos (PostgreSQL) ---
# Los valores se leen de variables de entorno; los de la derecha son los valores por defecto.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:champions}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- API pública TheSportsDB ---
sportsdb.base-url=${SPORTSDB_BASE_URL:https://www.thesportsdb.com/api/v1/json}
sportsdb.api-key=${SPORTSDB_API_KEY:123}
# 4480 = UEFA Champions League
sportsdb.league-id=${SPORTSDB_LEAGUE_ID:4480}
sportsdb.season=${SPORTSDB_SEASON:2026-2027}
# Jornadas a descargar (la API gratuita devuelve los partidos jornada por jornada)
sportsdb.rounds=${SPORTSDB_ROUNDS:1,2,3,4,5,6,7,8}
# Pausa entre llamadas para respetar el límite de peticiones de la clave gratuita
sportsdb.delay-ms=${SPORTSDB_DELAY_MS:3000}
# Sincronizar partidos con la API al iniciar la aplicación
sportsdb.sync-on-startup=${SPORTSDB_SYNC_ON_STARTUP:true}
